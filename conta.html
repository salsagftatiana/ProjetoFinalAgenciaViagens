<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta — Sonhos em Viagem</title>
  <link rel="stylesheet" href="firebase.css">
</head>
<body class="auth-page">
  <nav class="top-nav">
    <a class="logo-icone" href="index.html" aria-label="Sonhos em Viagem"><img src="assets/logo.png" alt="Sonhos em Viagem"></a>
    <div class="links">
      <a href="index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.1c0 .6-.5 1.1-1.1 1.1h-5.1v-6.2H9.2V21H4.1C3.5 21 3 20.5 3 19.9v-9.1Z"/><path d="M1.8 11.7 12 2.8l10.2 8.9"/></svg><span>Início</span></a>
      <a href="pacotes.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5.7C8 3.7 9.7 2 11.7 2h.6C14.3 2 16 3.7 16 5.7V7"/><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 7v14M16 7v14"/></svg><span>Pacotes</span></a>
      <a href="conta.html?next=agendar-viagem.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2"/></svg><span>Agendar</span></a>
      <a class="active" href="conta.html"><svg class="ico user" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c.8-4.4 4-7 8-7s7.2 2.6 8 7Z"/></svg><span>Conta</span></a>
      <a href="sobre.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg><span>Sobre</span></a>
    </div>
  </nav>
  <main class="auth-card auth-card-wide">
    <h1>A minha conta</h1>
    <p>Entre na sua conta ou crie uma conta para guardar e consultar os seus agendamentos.</p>
    <div class="auth-grid">
      <section>
        <h2>Entrar</h2>
        <form id="loginForm">
          <label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required>
          <label for="loginPassword">Palavra-passe</label><input id="loginPassword" type="password" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
        </form>
      </section>
      <section class="register-section">
        <h2>Criar conta</h2>
        <form id="registerForm">
          <label for="registerEmail">Email</label><input id="registerEmail" type="email" autocomplete="email" required>
          <label for="registerPassword">Palavra-passe</label><input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required>
          <button type="submit">Criar conta</button>
        </form>
      </section>
    </div>
    <p id="authFeedback" class="feedback" role="status"></p>
    <p><a class="voltar-inicio" href="index.html">Voltar ao início</a></p>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
