  <link rel="stylesheet" href="nav.css">
</head>

  <!-- Formulário Principal configurado para redirecionar diretamente -->
  <form id="reservaForm" class="formulario" action="agendamento-sucesso.html" method="GET">
    <div class="container">
      <section class="coluna">
        <h2>Dados pessoais</h2>
        <label for="nome">Nome completo</label><input id="nome" type="text" required>
        <label for="nascimento">Data de nascimento</label><input id="nascimento" type="date" required>
        <label for="passaporte">CPF / Passaporte</label><input id="passaporte" type="text" required>
        <label for="nacionalidade">Nacionalidade</label>
        <select id="nacionalidade" required>
          <option value="">Selecione</option>
          <option>Portuguesa</option>
          <option>Brasileira</option>
          <option>Angolana</option>
          <option>Moçambicana</option>
          <option>Francesa</option>
          <option>Espanhola</option>
          <option>Alemã</option>
        </select>
        <label for="telemovel">Telemóvel</label>
        <div class="telefone-container">
          <select id="codigo-pais">
            <option>+351</option>
            <option>+55</option>
            <option>+34</option>
          </select>
          <input id="telemovel" type="tel" placeholder="912345678" required>
        </div>
        <label for="email">Email</label><input id="email" type="email" required>
        <label for="endereco">Endereço</label><input id="endereco" type="text">
        <label for="numero">N.º / Andar</label><input id="numero" type="text">
        <label for="codigo-postal">Código postal</label><input id="codigo-postal" type="text">
        <label for="cidade">Cidade</label><input id="cidade" type="text" required>
      </section>

      <section class="coluna">
        <h2>Dados da viagem</h2>
        <label for="tipo">Tipo de viagem</label><input id="tipo" type="text" placeholder="Ex.: Lazer" required>
        <label for="destino">Destino</label>
        <select id="destino" required>
          <option value="">Selecione</option>
          <option>Brasil</option>
          <option>Japão</option>
          <option>Maldivas</option>
          <option>França</option>
          <option>Croácia</option>
        </select>
        <label for="data-partida">Data de partida</label><input id="data-partida" type="date" required>
        <label for="data-chegada">Data de chegada</label><input id="data-chegada" type="date" required>
        <label for="hora-chegada">Hora de chegada</label><input id="hora-chegada" type="time">
        <label for="hora-partida">Hora de partida</label><input id="hora-partida" type="time">
        <label>Passageiros</label>
        <details class="pax">
          <summary class="pax-summary">Selecionar passageiros</summary>
          <div class="pax-box">
            <div class="pax-row">
              <span><strong>Adultos</strong><span class="sub"> +18 anos</span></span>
              <select id="adultos">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
              </select>
            </div>
            <div class="divider"></div>
            <div class="pax-row">
              <span><strong>Crianças</strong><span class="sub"> 0 aos 17 anos</span></span>
              <select id="criancas">
                <option>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
              </select>
            </div>
          </div>
        </details>
        <label for="preco-minimo">Preço mínimo (€)</label><input id="preco-minimo" type="number" min="0">
        <label for="preco-maximo">Preço máximo (€)</label><input id="preco-maximo" type="number" min="0">
        <label for="observacoes">Observações</label><textarea id="observacoes" rows="4"></textarea>
      </section>

      <section class="coluna">
        <h2>Preferências</h2>
        <label for="classe-voo">Classe do voo</label><input id="classe-voo" type="text" placeholder="Ex.: Económica">
        <label for="hospedagem">Tipo de hospedagem</label><input id="hospedagem" type="text" placeholder="Hotel, resort, pousada…">
        <label>Tipo de quarto</label>
        <div class="bloco-opcoes">
          <label class="servico"><input type="checkbox" name="quarto" value="Casal">Casal</label>
          <label class="servico"><input type="checkbox" name="quarto" value="Solteiro">Solteiro</label>
          <label class="servico"><input type="checkbox" name="quarto" value="Duplo">Duplo</label>
          <label class="servico"><input type="checkbox" name="quarto" value="Triplo">Triplo</label>
        </div>
        <hr>
        <h2>Extras</h2>
        <div class="bloco-opcoes">
          <label class="servico"><input type="checkbox" name="extras" value="Alugar carro">Alugar carro</label>
          <label class="servico"><input type="checkbox" name="extras" value="Seguro de viagem">Seguro de viagem</label>
          <label class="servico"><input type="checkbox" name="extras" value="Pequeno-almoço">Pequeno-almoço</label>
          <label class="servico"><input type="checkbox" name="extras" value="Passeios com guia">Passeios com guia</label>
        </div>

        <button type="submit" class="btn-agendar" style="margin-top: 20px;">Agendar Viagem</button>

        <p id="mensagem-sessao" style="display: none;">A verificar sessão...</p>
        <p id="feedback" style="color: red;"></p>
      </section>
    </div>
  </form>

  <footer>
    <p class="copy">&copy; 2026 — Programação Web (Frontend)</p>
  </footer>

  <script>
    if (location.protocol === 'file:') {
      const feedback = document.getElementById('feedback');
      if (feedback) {
        feedback.textContent = 'Abra o projeto através de um servidor local (por exemplo, Live Server). O Firebase não funciona ao abrir o ficheiro diretamente.';
      }
    }
  </script>
  <script type="module" src="reservas-form.js"></script>
</body>

</html>
